<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#092763" />
    <title>Policy Insight Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA deep-link restore: 404.html rewrites a deep link into
      // "#/path". Convert it back to the history path so wouter (history mode)
      // renders the correct route.
      (function () {
        var m = /^#(\/.*)$/.exec(location.hash);
        if (m) {
          history.replaceState(null, "", m[1] + location.search);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Optional Umami analytics: injected only when VITE_ANALYTICS_ENDPOINT is
      // configured at build time (Vite leaves undefined placeholders literal).
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        if (!endpoint || endpoint.indexOf("%VITE_") === 0) return;
        var websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        var s = document.createElement("script");
        s.defer = true;
        s.src = endpoint + "/umami";
        s.setAttribute("data-website-id", websiteId);
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
